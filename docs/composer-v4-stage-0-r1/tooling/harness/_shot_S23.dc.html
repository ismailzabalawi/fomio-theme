<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0;background:#E9E8EE;overflow:hidden}</style>
</helmet>
<dc-import name="FmComposer4" viewport="{{ vp }}" scheme="{{ scheme }}" preset="{{ preset }}" rtl="{{ rtl }}" hwkb="{{ hw }}" zoom="{{ zoom }}" reduced-motion="{{ rm }}" hint-size="390px,844px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return {"vp": "phone", "scheme": "light", "preset": "C15-1", "rtl": false, "hw": false, "zoom": "1", "rm": false}; }
}
</script>
</body>
</html>
